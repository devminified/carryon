_format_version: "3.0"
_transform: true

###
# CO-506: the one API gateway every client/web app/CLI talks to.
# Routes map 1:1 onto docker-compose.yml's own services — see that
# file's own header comment. `key-auth` on each service checks the
# anon/service-role API key the same way Supabase Cloud's own Kong
# config does (consumers below); real authorization is still each
# downstream service's own job (GoTrue's JWT, PostgREST's RLS-backed
# JWT, storage-api's bucket policies) — Kong's key-auth here is only
# "is this a request carrying one of our two known API keys," not a
# user identity check.
###

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: realtime-v1
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: functions-v1
    url: http://edge-functions:9000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1
    plugins:
      - name: cors

consumers:
  - username: anon
    keyauth_credentials:
      - key: $ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SERVICE_ROLE_KEY

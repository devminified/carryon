version: 2

project_name: carryon

before:
  hooks:
    - go mod tidy

builds:
  - id: carryon
    main: ./cmd/carryon
    binary: carryon
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # NFR-09: Windows targets amd64 only.
      - goos: windows
        goarch: arm64

archives:
  - id: carryon
    ids:
      - carryon
    formats:
      - tar.gz
    name_template: >-
      {{ .Binary }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

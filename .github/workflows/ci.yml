name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # CO-508: a real secret scan on every PR, catching a new secret
  # before it merges. Not gitleaks/gitleaks-action — that wrapper
  # requires a paid GITLEAKS_LICENSE for an organization-owned repo
  # (confirmed: devminified is a real GitHub Organization, via
  # `gh api orgs/devminified`, not a personal account), which nothing
  # here has provisioned. The underlying gitleaks CLI itself is free
  # and open source regardless of org/user ownership — this installs
  # and runs that directly. A full-history scan (fetch-depth 0,
  # --log-opts="--all") is a separate, manual, one-time check (see
  # .gitleaks.toml's own header comment for how it was run and what
  # it found) — this job only scans each PR's own new commits against
  # main, so re-scanning 80+ commits of already-reviewed history on
  # every push isn't pure cost for no new signal.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: scan this PR's new commits for secrets
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="origin/${{ github.event.pull_request.base.ref || 'main' }}..HEAD" \
            --redact -v

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race ./...

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4 # matches the edge-runtime's Deno version (see ci.yml's supabase start, deploy-functions.yml)
      - name: start local stack (applies every migration to a fresh database)
        run: supabase start
      - name: db lint
        run: supabase db lint
      - name: migrations are idempotent on re-run (CO-102)
        run: supabase db reset
      - name: pgTAP (RLS policies, CO-302)
        run: supabase test db supabase/tests/database --local
      - name: deno lint
        run: deno lint supabase/functions
      - name: deno fmt check
        run: deno fmt --check supabase/functions
      - name: deno test
        run: deno test --allow-net --allow-env --allow-read supabase/functions

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: build (dummy anon key — no local Supabase in this job)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_build_placeholder
          # a recognizable, non-secret marker — grepped for below to prove
          # the service-role key never reaches a client-shipped file,
          # regardless of what the real value is in any environment
          # (CO-401's own "grep of the bundle shows no service-role key"
          # testing point, made into a real empirical check rather than
          # "true by construction because nothing imports admin.ts yet").
          SUPABASE_SERVICE_ROLE_KEY: service-role-key-must-never-reach-the-client-bundle
      - name: grep client bundle for service-role key leakage (CO-401)
        run: |
          if grep -rq "service-role-key-must-never-reach-the-client-bundle" .next/static/ 2>/dev/null; then
            echo "SUPABASE_SERVICE_ROLE_KEY leaked into the client bundle"
            exit 1
          fi

  # `pnpm exec playwright install --with-deps chromium` used to shell
  # out to apt for Chromium's recommended font packages
  # (xfonts-utils, fonts-ipafont-gothic, ...) straight from Ubuntu's
  # own mirrors (security.ubuntu.com/archive.ubuntu.com) — a real,
  # repeat (3x in a row, 2026-11-11) DNS-resolution flake on those
  # mirrors from the runner's network, unrelated to this repo's code.
  # Switched to running the actual test step inside Microsoft's own
  # Playwright image, pinned to the exact @playwright/test version in
  # pnpm-lock.yaml (`docker run` against mcr.microsoft.com, not
  # Ubuntu's package mirrors) — it ships Chromium plus every one of
  # those system dependencies pre-baked, so this job no longer calls
  # apt at all. `supabase start` still runs directly on the runner (it
  # needs the host's own Docker daemon for its own containers);
  # `--network host` on the Playwright container is what lets it reach
  # that already-running stack via the same 127.0.0.1 ports. The image
  # ships Node 26 with no corepack (removed from recent Node core), so
  # `npm install -g pnpm` substitutes for `corepack enable` here; a
  # fresh `pnpm install` always runs inside the container rather than
  # reusing the host's own node_modules — several of this project's
  # deps (sharp, @next/swc, lightningcss, ...) ship Node-ABI-specific
  # native binaries, and nothing here has verified those stay
  # binary-compatible across Node 22 (the host) and 26 (this image).
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: start local stack (applies every migration + seed.sql)
        run: supabase start
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: seed e2e fixtures
        # Normally pnpm test:e2e's own pretest:e2e hook does this (see
        # web/package.json) — done as its own explicit step here
        # because the real test run below happens inside a separate
        # container, which never triggers this host-side npm lifecycle
        # hook.
        run: pnpm run seed:e2e
        working-directory: web
      - name: run Playwright inside the official Playwright image
        working-directory: web
        run: |
          docker run --rm --network host \
            -e CI=true \
            -e NEXT_PUBLIC_SUPABASE_URL \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.65.0-noble \
            sh -c "npm install -g pnpm@10.17.1 && pnpm install --frozen-lockfile && pnpm exec playwright test"
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          # CO-402's modules/sessions/data/queries.ts resolves developer
          # logins via the admin client (architecture.md's "RLS can't
          # express this" exception) — needed for real here, not just
          # for the `web` job's leak check.
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  cross-compile:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: build --snapshot --clean
        env:
          # CO-308: -ldflags templates {{.Env.UPDATE_PUBLIC_KEY_HEX}} —
          # goreleaser's own template engine errors outright on a truly
          # *unset* env var (found via a real CI failure; unlike a plain
          # Go template, it doesn't degrade a missing map key to "").
          # An explicitly-empty value here matches the same "no
          # production signing key provisioned yet" default main.go's
          # own updatePublicKeyHex = "" already documents.
          UPDATE_PUBLIC_KEY_HEX: ""
      - name: check binary size (under 25 MB per target, NFR-01)
        run: |
          find dist -type f \( -name 'carryon' -o -name 'carryon.exe' \) -print0 \
            | xargs -0 -I{} sh -c 'echo {}; test "$(stat -c%s "{}" 2>/dev/null || stat -f%z "{}")" -lt 26214400'

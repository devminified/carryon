name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race ./...

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4 # matches the edge-runtime's Deno version (see ci.yml's supabase start, deploy-functions.yml)
      - name: start local stack (applies every migration to a fresh database)
        run: supabase start
      - name: db lint
        run: supabase db lint
      - name: migrations are idempotent on re-run (CO-102)
        run: supabase db reset
      - name: pgTAP (RLS policies, CO-302)
        run: supabase test db supabase/tests/database --local
      - name: deno lint
        run: deno lint supabase/functions
      - name: deno fmt check
        run: deno fmt --check supabase/functions
      - name: deno test
        run: deno test --allow-net --allow-env supabase/functions

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: build (dummy anon key — no local Supabase in this job)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_build_placeholder
          # a recognizable, non-secret marker — grepped for below to prove
          # the service-role key never reaches a client-shipped file,
          # regardless of what the real value is in any environment
          # (CO-401's own "grep of the bundle shows no service-role key"
          # testing point, made into a real empirical check rather than
          # "true by construction because nothing imports admin.ts yet").
          SUPABASE_SERVICE_ROLE_KEY: service-role-key-must-never-reach-the-client-bundle
      - name: grep client bundle for service-role key leakage (CO-401)
        run: |
          if grep -rq "service-role-key-must-never-reach-the-client-bundle" .next/static/ 2>/dev/null; then
            echo "SUPABASE_SERVICE_ROLE_KEY leaked into the client bundle"
            exit 1
          fi

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: start local stack (applies every migration + seed.sql)
        run: supabase start
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          # CO-402's modules/sessions/data/queries.ts resolves developer
          # logins via the admin client (architecture.md's "RLS can't
          # express this" exception) — needed for real here, not just
          # for the `web` job's leak check. pnpm test:e2e's own
          # pretest:e2e hook seeds both CO-402's and CO-403's real
          # fixture data (web/e2e/seed.sql, seed-viewer-fixtures.mjs)
          # before Playwright runs — see web/package.json.
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  cross-compile:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.0
          args: build --snapshot --clean
        env:
          # CO-308: -ldflags templates {{.Env.UPDATE_PUBLIC_KEY_HEX}} —
          # goreleaser's own template engine errors outright on a truly
          # *unset* env var (found via a real CI failure; unlike a plain
          # Go template, it doesn't degrade a missing map key to "").
          # An explicitly-empty value here matches the same "no
          # production signing key provisioned yet" default main.go's
          # own updatePublicKeyHex = "" already documents.
          UPDATE_PUBLIC_KEY_HEX: ""
      - name: check binary size (under 25 MB per target, NFR-01)
        run: |
          find dist -type f \( -name 'carryon' -o -name 'carryon.exe' \) -print0 \
            | xargs -0 -I{} sh -c 'echo {}; test "$(stat -c%s "{}" 2>/dev/null || stat -f%z "{}")" -lt 26214400'
